name: Build

on:
  push:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x86_64
            os: windows-2022
            binary: target/release/hop.exe
          - platform: linux-x86_64
            os: ubuntu-24.04
            binary: target/release/hop

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential pkg-config libx11-dev libxi-dev libxcursor-dev \
            libxrandr-dev libxkbcommon-dev libwayland-dev libegl1-mesa-dev

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        run: cargo build --release --locked

      - name: Upload release binary
        uses: actions/upload-artifact@v4
        with:
          name: hop-${{ matrix.platform }}
          path: ${{ matrix.binary }}
          if-no-files-found: error
